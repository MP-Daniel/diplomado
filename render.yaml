# Render Blueprint Specification (render.yaml)
# Taller 3: Auto-deploy a Render desde main
services:
  - type: web
    name: taller3-dashboard-modo-oscuro
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: ENVIRONMENT
        value: production
      - key: FEATURE_STAGE
        value: ticket_1
      - key: CONFIGCAT_SDK_KEY
        sync: false
