name: CI Pipeline & Quality Gate (Taller 3)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Análisis Estático / Lint (Flake8)
        run: |
          # Falla el pipeline si hay errores de sintaxis o variables no definidas
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Estilo de código PEP8 (max line length 120)
          flake8 app tests --count --max-line-length=120 --statistics

      - name: 2. Pruebas Automatizadas (Pytest)
        run: |
          pytest -v

      - name: 3. Verificar Construcción Docker
        run: |
          docker build -t taller3-modo-oscuro:latest .
